services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: content_creator
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d content_creator"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # Valores de apps/api/.env entram no container; não use ${VAR:-} aqui para AWS/JWT —
    # isso só lê o .env da raiz do projeto e string vazia sobrescreve o env_file.
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://app:app@postgres:5432/content_creator?sslmode=disable
      COOKIE_SECURE: "false"
      WORKER_URL: http://worker:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 15s

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    env_file:
      - path: ./apps/worker/.env
        required: false
    environment:
      GO_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PUBLISH_PORT:-5173}:80"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 15s

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
