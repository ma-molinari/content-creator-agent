<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 04 — Pensamento positivo tóxico</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    /* ── Background ── */
    .blob-a {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(237,201,74,0.10) 0%, transparent 68%);
      top: -60px;
      right: -120px;
    }

    .blob-b {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(193,52,90,0.06) 0%, transparent 70%);
      bottom: 200px;
      left: -60px;
    }

    /* ── Stars ── */
    .s1 { top: 190px; right: 66px;  font-size: 18px; }
    .s2 { top: 230px; right: 140px; font-size: 11px; opacity: 0.6; }
    .s3 { bottom: 344px; left: 200px; font-size: 12px; opacity: 0.55; }

    /* ── Warning badge (sticker-style) ── */
    .warning-badge {
      position: absolute;
      top: 152px;
      right: var(--pad-x);
      z-index: 10;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      transform: rotate(-8deg);
    }

    /* ── Content wrapper ── */
    .wrap {
      position: absolute;
      top: 148px;
      left: var(--pad-x);
      right: var(--pad-x);
    }

    /* ── Eyebrow ── */
    .wrap .eyebrow {
      margin-top: 44px;
      margin-bottom: 36px;
    }

    /* ── Headline ── */
    .headline {
      font-size: 74px;
      font-weight: 800;
      line-height: 0.95;
      color: var(--black);
      letter-spacing: -0.03em;
      max-width: 480px;
    }

    .headline em {
      font-style: normal;
      color: var(--magenta);
    }

    /* ── Divider with spacing ── */
    .mid-divider {
      margin: 44px 0;
    }

    /* ── Body block ── */
    .body-main {
      font-size: 34px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--dark);
      max-width: 600px;
    }

    .body-main strong {
      font-weight: 700;
      color: var(--black);
    }

    /* ── Secondary text ── */
    .body-sub {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.52;
      color: var(--gray);
      max-width: 580px;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--gray-light);
    }

    /* ── Bottom strip ── */
    .bottom-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 276px;
      background: linear-gradient(to top, rgba(236,201,74,0.04) 0%, transparent 100%);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="bottom-strip"></div>

    <!-- Brand lockup -->
    <div class="brand">
      <span class="brand__handle">@stephaniefalanque</span>
      <span class="brand__role">Psicóloga de Jovens Adultas</span>
    </div>

    <!-- Warning badge -->
    <div class="warning-badge">⚠</div>

    <!-- Stars -->
    <i class="star s1">✦</i>
    <i class="star s2">✦</i>
    <i class="star s3">✦</i>

    <!-- Content -->
    <div class="wrap">
      <div class="eyebrow">
        <div class="eyebrow__dot"></div>
        <span class="eyebrow__label">Atenção</span>
      </div>

      <h1 class="headline">
        Pensamento<br>
        positivo<br>
        <em>tóxico</em>
      </h1>

      <div class="divider mid-divider"></div>

      <p class="body-main">
        Forçar <strong>"fica bem"</strong> / <strong>"só pensa positivo"</strong> pode piorar a ansiedade.
      </p>

      <p class="body-sub">
        Invalida o que você sente e aumenta a culpa — o corpo continua em alerta.
      </p>
    </div>

    <!-- Slide number -->
    <div class="slide-num">04 / 06</div>

  </div>
</body>
</html>
