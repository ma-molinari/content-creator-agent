<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 03 — Mito: Ansiedade tem cura definitiva</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    /* ── Two-zone background — stronger visual tension ── */
    .mito-zone {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 740px;
      background: var(--cream-deep);
      z-index: 0;
    }

    .mito-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 70% at 100% 10%, rgba(45,42,41,0.05) 0%, transparent 60%);
    }

    /* ── Stars ── */
    .s1 { top: 214px; right: 56px;  font-size: 18px; }
    .s2 { top: 600px; left: var(--pad-x); font-size: 11px; opacity: 0.5; }
    .s3 { bottom: 340px; right: 56px; font-size: 14px; opacity: 0.7; }

    /* ── Zone divider ── */
    .zone-divider {
      position: absolute;
      top: 740px;
      left: 0; right: 0;
      height: 1px;
      background: var(--gray-light);
      z-index: 5;
    }

    /* ── MITO content ── */
    .mito-content {
      position: absolute;
      top: 216px;
      left: var(--pad-x);
      right: var(--pad-x);
      z-index: 10;
    }

    .quote {
      font-size: 78px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.08;
      color: var(--black);
      letter-spacing: -0.02em;
      margin-top: 32px;
    }

    .quote-mark {
      font-size: 108px;
      font-weight: 800;
      font-style: normal;
      line-height: 0.7;
      color: var(--magenta);
      display: block;
      margin-bottom: -12px;
      opacity: 0.16;
    }

    /* ── VERDADE content ── */
    .verdade-content {
      position: absolute;
      top: 772px;
      left: var(--pad-x);
      right: var(--pad-x);
      z-index: 10;
    }

    .truth {
      font-size: 36px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--dark);
      margin-top: 28px;
      max-width: 600px;
    }

    /* ── Bottom strip ── */
    .bottom-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 276px;
      background: linear-gradient(to top, rgba(193,52,90,0.03) 0%, transparent 100%);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="mito-zone"></div>
    <div class="bottom-strip"></div>

    <!-- Brand lockup -->
    <div class="brand">
      <span class="brand__handle">@stephaniefalanque</span>
      <span class="brand__role">Psicóloga de Jovens Adultas</span>
    </div>

    <!-- Stars -->
    <i class="star s1">✦</i>
    <i class="star s2">✦</i>
    <i class="star s3">✦</i>

    <!-- MITO content -->
    <div class="mito-content">
      <div class="pill pill--dark">✦ &nbsp;Mito</div>
      <span class="quote-mark">"</span>
      <p class="quote">Ansiedade tem<br>cura definitiva"</p>
    </div>

    <!-- Zone divider -->
    <div class="zone-divider"></div>

    <!-- VERDADE content -->
    <div class="verdade-content">
      <div class="pill pill--mag">Verdade</div>
      <p class="truth">
        Dá para aprender a gerenciar e viver bem — sem promessa mágica de "sumir pra sempre".
      </p>
    </div>

    <!-- Slide number -->
    <div class="slide-num">03 / 06</div>

  </div>
</body>
</html>
