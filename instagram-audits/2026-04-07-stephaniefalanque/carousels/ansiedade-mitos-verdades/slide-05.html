<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 05 — O que costuma ajudar mais</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    /* ── Background blobs ── */
    .blob-a {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(193,52,90,0.07) 0%, transparent 68%);
      top: -80px;
      left: -80px;
    }

    .blob-b {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(193,52,90,0.04) 0%, transparent 70%);
      bottom: 220px;
      right: -40px;
    }

    /* ── Stars ── */
    .s1 { top: 186px; right: 58px;  font-size: 20px; }
    .s2 { top: 222px; right: 128px; font-size: 11px; opacity: 0.6; }
    .s3 { bottom: 336px; right: 120px; font-size: 13px; opacity: 0.6; }

    /* ── Content wrapper ── */
    .wrap {
      position: absolute;
      top: 148px;
      left: var(--pad-x);
      right: var(--pad-x);
    }

    /* ── Eyebrow ── */
    .wrap .eyebrow {
      margin-top: 44px;
      margin-bottom: 36px;
    }

    /* ── Headline ── */
    .headline {
      font-size: 68px;
      font-weight: 800;
      line-height: 0.97;
      color: var(--black);
      letter-spacing: -0.03em;
      max-width: 520px;
    }

    /* ── Accent line spacer ── */
    .line-gap {
      margin: 44px 0 48px;
    }

    /* ── Bullets stack ── */
    .bullets {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* Highlight keyword in bullet */
    .bullet__text strong {
      font-weight: 600;
      color: var(--black);
    }

    /* ── Bottom strip ── */
    .bottom-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 276px;
      background: linear-gradient(to top, rgba(193,52,90,0.04) 0%, transparent 100%);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="bottom-strip"></div>

    <!-- Brand lockup -->
    <div class="brand">
      <span class="brand__handle">@stephaniefalanque</span>
      <span class="brand__role">Psicóloga de Jovens Adultas</span>
    </div>

    <!-- Stars -->
    <i class="star s1">✦</i>
    <i class="star s2">✦</i>
    <i class="star s3">✦</i>

    <!-- Content -->
    <div class="wrap">
      <div class="eyebrow">
        <div class="eyebrow__dot"></div>
        <span class="eyebrow__label">O que funciona</span>
      </div>

      <h1 class="headline">
        O que costuma<br>ajudar mais
      </h1>

      <div class="accent-line line-gap"></div>

      <div class="bullets">
        <div class="bullet">
          <div class="bullet__bar"></div>
          <p class="bullet__text">
            <strong>Nomear o que sente</strong> (sem julgar)
          </p>
        </div>

        <div class="bullet">
          <div class="bullet__bar"></div>
          <p class="bullet__text">
            <strong>Reduzir a luta</strong> contra a ansiedade
          </p>
        </div>

        <div class="bullet">
          <div class="bullet__bar"></div>
          <p class="bullet__text">
            <strong>Pequenos passos</strong> + apoio profissional quando fizer sentido
          </p>
        </div>
      </div>
    </div>

    <!-- Slide number -->
    <div class="slide-num">05 / 06</div>

  </div>
</body>
</html>
