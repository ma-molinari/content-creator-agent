<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 01 — Ansiedade: Mitos vs. Verdades</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    /* ── Background blobs ── */
    .blob-a {
      width: 620px;
      height: 620px;
      background: radial-gradient(circle, rgba(193,52,90,0.08) 0%, transparent 68%);
      top: -120px;
      right: -160px;
    }

    .blob-b {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(193,52,90,0.05) 0%, transparent 70%);
      bottom: 180px;
      left: -90px;
    }

    .blob-c {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(236,201,74,0.14) 0%, transparent 70%);
      top: 640px;
      right: 48px;
    }

    /* ── Stars ── */
    .s1 { top: 192px; right: 78px;  font-size: 22px; }
    .s2 { top: 234px; right: 156px; font-size: 13px; opacity: 0.7; }
    .s3 { top: 760px; right: 62px;  font-size: 17px; }
    .s4 { bottom: 338px; left: 56px; font-size: 11px; opacity: 0.55; }

    /* ── Content wrapper ── */
    .wrap {
      position: absolute;
      top: 148px;
      left: var(--pad-x);
      right: var(--pad-x);
    }

    /* ── Eyebrow ── */
    .wrap .eyebrow {
      margin-top: 44px;
      margin-bottom: 40px;
    }

    /* ── Headlines ── */
    .hl-main {
      display: block;
      font-size: 110px;
      font-weight: 800;
      line-height: 0.92;
      color: var(--black);
      letter-spacing: -0.03em;
    }

    .hl-light {
      display: block;
      font-size: 96px;
      font-weight: 300;
      line-height: 1.02;
      color: var(--gray);
      letter-spacing: -0.02em;
    }

    .hl-accent {
      display: block;
      font-size: 110px;
      font-weight: 800;
      line-height: 1.0;
      color: var(--magenta);
      letter-spacing: -0.03em;
    }

    /* ── Break ── */
    .break {
      margin: 44px 0 36px;
    }

    /* ── Subline ── */
    .subline {
      font-size: 27px;
      font-weight: 400;
      line-height: 1.52;
      color: var(--dark);
      max-width: 490px;
    }

    /* ── Bottom decorative strip ── */
    .bottom-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 276px;
      background: linear-gradient(to top, rgba(193,52,90,0.04) 0%, transparent 100%);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="slide">

    <!-- Background blobs -->
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="bottom-strip"></div>

    <!-- Brand lockup -->
    <div class="brand">
      <span class="brand__handle">@stephaniefalanque</span>
      <span class="brand__role">Psicóloga de Jovens Adultas</span>
    </div>

    <!-- Stars -->
    <i class="star s1">✦</i>
    <i class="star s2">✦</i>
    <i class="star s3">✦</i>
    <i class="star s4">✦</i>

    <!-- Main content -->
    <div class="wrap">
      <div class="eyebrow">
        <div class="eyebrow__dot"></div>
        <span class="eyebrow__label">Saúde Mental</span>
      </div>

      <span class="hl-main">Ansiedade:</span>
      <span class="hl-light">mitos vs.</span>
      <span class="hl-accent">verdades</span>

      <div class="accent-line break"></div>

      <p class="subline">
        3 coisas que talvez já tenham te dito — e o que a ciência mostra
      </p>
    </div>

    <!-- Slide number -->
    <div class="slide-num">01 / 06</div>

  </div>
</body>
</html>
