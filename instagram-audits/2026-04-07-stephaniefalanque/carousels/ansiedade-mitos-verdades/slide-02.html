<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 02 — Mito: Ansiedade é frescura</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    /* ── Two-zone background split ── */
    .mito-zone {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 720px;
      background: var(--cream-dark);
      z-index: 0;
    }

    /* Subtle warm bloom inside mito zone */
    .mito-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 85% 30%, rgba(193,52,90,0.06) 0%, transparent 70%);
    }

    /* ── Divider line at zone boundary ── */
    .zone-divider {
      position: absolute;
      top: 720px;
      left: 0; right: 0;
      height: 1px;
      background: var(--gray-light);
      z-index: 5;
    }

    /* ── Stars ── */
    .s1 { top: 210px; right: 60px; font-size: 20px; }
    .s2 { top: 248px; right: 130px; font-size: 11px; opacity: 0.6; }
    .s3 { bottom: 338px; right: 54px; font-size: 15px; opacity: 0.75; }

    /* ── MITO section content ── */
    .mito-content {
      position: absolute;
      top: 230px;
      left: var(--pad-x);
      right: var(--pad-x);
      z-index: 10;
    }

    .quote {
      font-size: 84px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.07;
      color: var(--black);
      letter-spacing: -0.025em;
      margin-top: 36px;
    }

    .quote-mark {
      font-size: 120px;
      font-weight: 800;
      font-style: normal;
      line-height: 0.7;
      color: var(--magenta);
      display: block;
      margin-bottom: -16px;
      opacity: 0.18;
    }

    /* ── VERDADE section content ── */
    .verdade-content {
      position: absolute;
      top: 752px;
      left: var(--pad-x);
      right: var(--pad-x);
      z-index: 10;
    }

    .truth {
      font-size: 38px;
      font-weight: 400;
      line-height: 1.48;
      color: var(--dark);
      margin-top: 28px;
      max-width: 580px;
    }

    /* ── Bottom decorative gradient ── */
    .bottom-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 276px;
      background: linear-gradient(to top, rgba(193,52,90,0.03) 0%, transparent 100%);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="slide">

    <!-- Zone backgrounds -->
    <div class="mito-zone"></div>
    <div class="bottom-strip"></div>

    <!-- Brand lockup -->
    <div class="brand">
      <span class="brand__handle">@stephaniefalanque</span>
      <span class="brand__role">Psicóloga de Jovens Adultas</span>
    </div>

    <!-- Stars -->
    <i class="star s1">✦</i>
    <i class="star s2">✦</i>
    <i class="star s3">✦</i>

    <!-- MITO content -->
    <div class="mito-content">
      <div class="pill pill--dark">✦ &nbsp;Mito</div>
      <span class="quote-mark">"</span>
      <p class="quote">Ansiedade<br>é frescura"</p>
    </div>

    <!-- Zone divider -->
    <div class="zone-divider"></div>

    <!-- VERDADE content -->
    <div class="verdade-content">
      <div class="pill pill--mag">Verdade</div>
      <p class="truth">
        É uma resposta química e biológica do corpo — não é "drama".
      </p>
    </div>

    <!-- Slide number -->
    <div class="slide-num">02 / 06</div>

  </div>
</body>
</html>
