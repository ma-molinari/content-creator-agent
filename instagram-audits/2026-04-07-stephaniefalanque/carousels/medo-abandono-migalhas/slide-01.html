<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 01 — Medo do abandono: migalhas</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      width: 100%;
    }
    .kicker {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.35;
      max-width: 560px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }
    .strip-stack {
      align-items: center;
    }
    .strip--hero {
      font-size: 40px;
      padding: 16px 26px;
    }
    .strip--hero-sm {
      font-size: 34px;
      padding: 14px 22px;
    }
  </style>
</head>
<body>
  <div class="slide slide--photo">
    <div class="photo-bg" aria-hidden="true"></div>
    <header class="brand-bar brand-bar--light">
      <span class="brand-bar__handle">@stephaniefalanque</span>
      <span class="brand-bar__sep">//</span>
      <span class="brand-bar__role">Psicóloga de<br>Jovens Adultas</span>
    </header>
    <div class="slide__body-centered slide__body-centered--center">
      <div class="hero">
      <p class="kicker">E se a pergunta incômoda for…</p>
      <div class="strip-stack strip-stack--center">
        <span class="strip strip--hero strip--tilt">POR QUE VOCÊ</span>
        <span class="strip strip--hero-sm strip--tilt-alt">ACEITA MIGALHAS?</span>
        <span class="strip strip--rose strip--tilt" style="max-width: 620px;">
          Por trás disso, muitas vezes, mora um medo antigo: o do abandono.
        </span>
      </div>
      </div>
    </div>
    <div class="slide-num">01 / 06</div>
  </div>
</body>
</html>
