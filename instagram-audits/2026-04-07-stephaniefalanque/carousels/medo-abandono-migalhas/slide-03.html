<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 03 — Migalhas como prova</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    .strip-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .line-strip {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }
    .tag {
      position: absolute;
      top: 100px;
      left: var(--pad-x);
      z-index: 11;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--dark);
      opacity: 0.85;
    }
    .slide-03-note {
      width: 100%;
      max-width: 100%;
      margin-top: 36px;
      padding: 20px 22px;
      background: rgba(46, 46, 46, 0.72);
      color: var(--white);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="slide slide--photo">
    <div class="pink-wash" aria-hidden="true"></div>
    <header class="brand-bar brand-bar--dark">
      <span class="brand-bar__handle">@stephaniefalanque</span>
      <span class="brand-bar__sep">//</span>
      <span class="brand-bar__role">Psicóloga de<br>Jovens Adultas</span>
    </header>
    <p class="tag">Agitação (com carinho)</p>
    <div class="slide__body-centered slide__body-centered--center slide__body-centered--narrow-top">
      <div class="strip-col">
        <span class="line-strip">AÍ QUALQUER MIGALHA</span>
        <span class="line-strip">VIRA «PROVA»</span>
        <span class="line-strip">DE QUE VOCÊ NÃO FOI</span>
        <span class="line-strip">ESQUECIDA.</span>
      </div>
      <div class="slide-03-note">
        Mensagem seca, plano de última hora, silêncio compensado por um gesto mínimo… e o corpo respira aliviado — porque “ainda tem alguém ali”.
      </div>
    </div>
    <div class="slide-num">03 / 06</div>
  </div>
</body>
</html>
