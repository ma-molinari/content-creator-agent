<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Slide 01 — Gancho</title>
  <link rel="stylesheet" href="slides.css">
</head>
<body class="photo-bg--burnout">

  <!-- Lockup Variant A — barra topo, versão clara (sobre foto escura) -->
  <div class="brand-bar brand-bar--light">
    <span class="handle">@STEPHANIEFALANQUE</span>
    <span class="divider">//</span>
    <span class="role">PSICÓLOGA DE JOVENS ADULTAS</span>
  </div>

  <div class="slide-content">

    <!-- Kicker temático -->
    <p class="t-kicker" style="color: var(--c-rosa-claro); letter-spacing: 0.16em;">
      Burnout &amp; Disfunção Executiva
    </p>

    <!-- Faixas magenta — título gancho -->
    <div style="display: flex; flex-direction: column; gap: 10px; align-self: flex-start;">
      <span class="strip">POR QUE</span>
      <span class="strip strip--alt">TAREFAS SIMPLES</span>
      <span class="strip">PARECEM MONTANHAS?</span>
    </div>

    <!-- Subtítulo em callout glass escuro -->
    <div class="callout callout--dark" style="margin-top: 8px;">
      <p class="t-body" style="color: var(--c-text-light);">
        Se você <strong style="color: var(--c-rosa-claro);">quer fazer</strong> mas o cérebro simplesmente trava — não é fraqueza. É exaustão emocional. E tem nome pra isso.
      </p>
    </div>

  </div>

</body>
</html>
