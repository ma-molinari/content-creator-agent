# Production-oriented overrides. Use with:
#   WEB_PUBLISH_PORT=80 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# (WEB_PUBLISH_PORT defaults to 5173 in the base file; set to 80 to bind the SPA on host port 80.)
services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SUMMARIZE_CRON: "${SUMMARIZE_CRON:-0 2 * * *}"

  worker:
    restart: unless-stopped

  web:
    restart: unless-stopped

