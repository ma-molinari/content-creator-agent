# Optional local-only overlay: docker compose -f docker-compose.yml -f docker-compose.localstack.yml up -d
services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket postmind-local >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: postmind-local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL_S3: http://localstack:4566
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
    depends_on:
      localstack:
        condition: service_healthy

  worker:
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: postmind-local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL_S3: http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy
